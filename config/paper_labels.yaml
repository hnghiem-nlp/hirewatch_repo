  OpenAI:    "#1D9E75"
  Anthropic: "#7F77DD"
  Google:    "#378ADD"
  Meta:      "#D85A30"
  Alibaba:   "#BA7517"
  DeepSeek:  "#D4537E"
  Mistral:   "#888780"

# ---- Safety Levels ----
# (suffix appended to condition slug, column name for CSVs, display label)
safety_levels:
  - suffix: ""
    column: no_safe
    label: None

  - suffix: "_safe_weak"
    column: safe_weak
    label: Weak

  - suffix: "_safe"
    column: safe_strong
    label: Strong

  - suffix: "_safe_cfr"
    column: safe_law
    label: Legal text

# ---- Personas ----
personas:
  A:
    employees: 10
    hr: false
    description: "10 employees, no HR department, below Title VII threshold"

  B:
    employees: 50
    hr: true
    description: "50 employees, with HR department"

  C:
    employees: 10000
    hr: true
    description: "10,000 employees, with HR department and legal team"

