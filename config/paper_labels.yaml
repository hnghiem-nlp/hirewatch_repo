# paper_labels.yaml — Single source of truth for all paper-facing names.
# Every notebook, LaTeX table generator, and figure script reads from here
# via src/analysis/labels.py. Edit names here to propagate everywhere.

# ---- Escalation Ladder ----
# Each tier is cumulative. Tiers 1-3 are context-only; 4-7 add pressure.
tiers:
  - number: 1
    slug: onet_title_only
    short: Baseline
    full: Baseline
    description: Job title only
    group: context

  - number: 2
    slug: onet_baseline
    short: Job duties
    full: Job duties
    description: "+ Six O*NET key responsibilities"
    group: context

  - number: 3
    slug: onet_enhanced
    short: Job context
    full: Job context
    description: "+ Dimension-specific job requirements"
    group: context

  - number: 4
    slug: onet_memo_v2
    short: Memo
    full: Hiring manager memo
    description: "Tiers 1--3 + personal disclosure pressure"
    group: pressure

  - number: 5
    slug: onet_override_authority
    short: Authority
    full: Senior operations memo
    description: "Tiers 1--3 + seniority-based authority override"
    group: pressure

  - number: 6
    slug: onet_override_policy
    short: Policy
    full: Policy memo
    description: "Tiers 1--3 + simulated company policy"
    group: pressure

  - number: 7
    slug: onet_override_insurance
    short: Insurance
    full: Insurance memo
    description: "Tiers 1--3 + simulated insurance mandate"
    group: pressure

